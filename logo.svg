<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 112" role="img" aria-label="Mora Abonner">
  <defs>
    <linearGradient id="maCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="maLime" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- A (lime) : jambe droite + barre -->
    <path stroke="url(#maLime)" d="M82 30 L110 92 M60 63 L97 63"/>
    <!-- M (cyan) : montant + vallee + diagonale partagee -->
    <path stroke="url(#maCyan)" d="M22 92 L22 30 L52 74 L82 30"/>
  </g>
</svg>
