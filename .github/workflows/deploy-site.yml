# Publier moraformation sur Cloudflare Pages.
#
# Le projet Pages ne suit pas ce depot : un commit ne declenchait donc
# aucune reconstruction, et le site restait fige sur une ancienne
# version sans que rien ne le signale. Ce workflow pousse les fichiers
# lui-meme, a chaque commit sur main.
name: Publier le site

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "*.svg"
      - "img/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: pages-moraformation
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifier le jeton
        run: |
          [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || {
            echo "::error::CLOUDFLARE_API_TOKEN absent."; exit 1; }
          [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || {
            echo "::error::CLOUDFLARE_ACCOUNT_ID absent."; exit 1; }

      - name: Rassembler le site
        run: |
          # Liste EXPLICITE, jamais une exclusion : un fichier ajoute a la
          # racine demain — une note, une cle, une sauvegarde — ne se
          # retrouvera pas publie sans que personne l'ait decide.
          mkdir -p _site
          for f in index.html formation.html app.js formation.js shared.js data.js style.css logo.svg; do
            [ -f "$f" ] || { echo "::error::$f manquant"; exit 1; }
            cp "$f" _site/
          done

          # Les couvertures des cartes Messenger. Elles vivent sur le site
          # du proprietaire, pas chez un tiers : une image hebergee
          # ailleurs disparait le jour ou l'hebergeur change d'avis, et
          # c'est la carte du client qui devient grise.
          if [ -d img ]; then
            mkdir -p _site/img && cp img/*.jpg _site/img/ 2>/dev/null || true
            echo "couvertures : $(ls _site/img | wc -l)"
          fi
          ls -la _site

          grep -q "widget.js" _site/index.html || {
            echo "::error::le chatbot n'est pas dans index.html"; exit 1; }

      - name: Publier
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.135.0 pages deploy _site \
            --project-name=moraformation --branch=main 2>&1 | tee sortie.txt || {
              # Deux pannes distinctes, deux gestes distincts. Les
              # confondre envoie chercher au mauvais endroit.
              if grep -q "9109" sortie.txt; then
                echo "::error::Le jeton stocke dans CE depot n'est plus valable (9109). Il a probablement ete regenere ailleurs : recollez la valeur actuelle dans Settings > Secrets > CLOUDFLARE_API_TOKEN de ce depot."
              elif grep -qiE "authentication|authorization|not authorized|10000|8000000" sortie.txt; then
                echo "::error::Le jeton n'a pas la permission « Cloudflare Pages ». dash.cloudflare.com/profile/api-tokens -> le jeton -> Edit -> Add more -> Account · Cloudflare Pages · Edit."
              fi
              exit 1
            }

      - name: Verifier la page publiee
        run: |
          for i in 1 2 3 4 5 6; do
            page=$(curl -sL --max-time 25 "https://moraformation.pages.dev/" || true)
            if echo "$page" | grep -qi "widget.js"; then
              echo "Le chatbot est dans la page publiee ($(echo "$page" | wc -c) octets)."
              exit 0
            fi
            echo "tentative $i : pas encore ($(echo "$page" | wc -c) octets)"
            sleep 10
          done
          echo "::error::La page publiee ne contient toujours pas le chatbot."
          exit 1
