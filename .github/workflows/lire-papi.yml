# Lire la documentation publique de papi.mg.
#
# La session de developpement n a pas d acces reseau vers ce domaine :
# sans ce relais, je devrais deviner le fonctionnement de l API, et une
# integration de PAIEMENT devinee est exactement ce qu il ne faut pas
# faire.
name: Lire papi.mg

on:
  workflow_dispatch:

jobs:
  lire:
    runs-on: ubuntu-latest
    steps:
      - name: La documentation technique
        run: |
          # Docusaurus rend le texte cote serveur : on peut le lire.
          for u in \
            "https://docs.papi.mg/fr/docs/overview" \
            "https://docs.papi.mg/fr/docs/quickstart" \
            "https://docs.papi.mg/fr/docs/developper-guide/integration-guide" \
            "https://docs.papi.mg/fr/docs/developper-guide/securing-notifications" ; do
            echo "=========================================== $u"
            code=$(curl -sL --max-time 25 -o p.html -w '%{http_code}' "$u" || echo 000)
            echo "HTTP $code"
            [ "$code" = "200" ] || continue
            sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<style[^>]*>.*<\/style>//g' \
                -e 's/<[^>]*>/\n/g' p.html \
              | sed -e 's/&quot;/"/g' -e "s/&#39;/'/g" -e 's/&amp;/\&/g' -e 's/&lt;/</g' -e 's/&gt;/>/g' \
              | grep -v '^[[:space:]]*$' | head -120
          done
