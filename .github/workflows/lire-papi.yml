# Lire la documentation publique de papi.mg.
#
# La session de developpement n a pas d acces reseau vers ce domaine :
# sans ce relais, je devrais deviner le fonctionnement de l API, et une
# integration de PAIEMENT devinee est exactement ce qu il ne faut pas
# faire.
name: Lire papi.mg

on:
  workflow_dispatch:

jobs:
  lire:
    runs-on: ubuntu-latest
    steps:
      - name: Le corps exact de la requete
        run: |
          u="https://docs.papi.mg/fr/docs/developper-guide/integration-guide"
          curl -sL --max-time 25 -o p.html "$u"
          sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<style[^>]*>.*<\/style>//g' \
              -e 's/<[^>]*>/\n/g' p.html \
            | sed -e 's/&quot;/"/g' -e "s/&#x27;/'/g" -e "s/&#39;/'/g" \
                  -e 's/&amp;/\&/g' -e 's/&lt;/</g' -e 's/&gt;/>/g' \
            | grep -av '^[[:space:]]*$' > t.txt

          echo "=== creation du lien de paiement (lignes 330-410) ==="
          sed -n '330,410p' t.txt

          echo
          echo "=== la reponse et le jeton (lignes 470-560) ==="
          sed -n '470,560p' t.txt

          echo
          echo "=== tout ce qui ressemble a une cle ou un en-tete ==="
          grep -anEi 'cle api|clé api|api.?key|header|en-tête|en-tete|token|secret' t.txt | head -40
